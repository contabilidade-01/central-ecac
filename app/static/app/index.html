<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integra Contador Desktop</title>
    <script type="module" crossorigin src="/assets/index-BV8l56Oy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BrQWbY9G.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Converter campos sensíveis para type="password" após renderização
      const observer = new MutationObserver(() => {
        document.querySelectorAll('label').forEach(label => {
          const text = label.textContent.trim().toLowerCase();
          if (text.includes('consumer key') || text.includes('consumer secret') ||
              text.includes('senha do certificado') || text.includes('senha do procurador')) {
            const input = label.parentElement.querySelector('input[type="text"], input:not([type])');
            if (input && input.type !== 'password') {
              input.type = 'password';
              input.autocomplete = 'off';
            }
          }
        });
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>

    <style>
      /* DESVIO INTENCIONAL (14o) — barra lateral por cima da SPA compilada.
         Nomes de classe conferidos contra o CSS do bundle: nenhuma colisão. */
      .header { display: none !important; }
      body { margin: 0; background: #f1f5f9; }
      .app { display: flex; min-height: 100vh; }
      .lateral { width: 252px; flex: 0 0 252px; background: #0f172a; color: #cbd5e1;
                 display: flex; flex-direction: column; position: sticky; top: 0;
                 height: 100vh; overflow-y: auto;
                 transition: margin-left .18s ease, opacity .18s ease;
                 font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      .lateral::-webkit-scrollbar { width: 6px; }
      .lateral::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      .marca-topo { display: flex; align-items: center; gap: 11px; padding: 18px 18px 14px; }
      .marca { width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
               background: linear-gradient(135deg,#2563eb,#1e40af); color: #fff;
               display: flex; align-items: center; justify-content: center;
               font-weight: 700; font-size: 13px; }
      .marca-topo b { display: block; font-size: 14px; color: #fff; line-height: 1.25; }
      .marca-topo span { display: block; font-size: 11px; color: #94a3b8; }
      .lateral nav { padding: 4px 10px 16px; flex: 1; }
      .secao { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;
               letter-spacing: .09em; padding: 14px 10px 6px; }
      .item { display: flex; align-items: center; gap: 11px; padding: 9px 10px;
              border-radius: 9px; color: #cbd5e1; text-decoration: none; font-size: 13.5px;
              cursor: pointer; border: 0; background: transparent; width: 100%;
              text-align: left; font-family: inherit; margin-bottom: 1px; }
      .item svg { width: 17px; height: 17px; flex: 0 0 auto; stroke: currentColor;
                  fill: none; stroke-width: 1.8; stroke-linecap: round;
                  stroke-linejoin: round; }
      .item:hover { background: #1e293b; color: #fff; }
      .item.ativo { background: #1d4ed8; color: #fff; font-weight: 600; }
      .item.sair { color: #fca5a5; }
      .item.sair:hover { background: #7f1d1d; color: #fff; }
      .lateral-rodape { padding: 14px 18px 18px; font-size: 11px; color: #64748b;
                        border-top: 1px solid #1e293b; }
      .conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column;
                 overflow-x: auto; }
      .barra { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 22px;
               display: flex; align-items: center; gap: 14px; position: sticky; top: 0;
               z-index: 20;
               font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      .barra b { font-size: 14px; font-weight: 600; color: #0f172a; }
      .barra .fim { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .alternar { background: transparent; border: 1px solid #e2e8f0; border-radius: 8px;
                  padding: 6px 9px; cursor: pointer; color: #64748b; line-height: 0;
                  margin: 0; }
      .alternar:hover { background: #f1f5f9; color: #0f172a; }
      .alternar svg { width: 17px; height: 17px; stroke: currentColor; fill: none;
                      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .pilula { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
                font-weight: 500; color: #15803d; background: #dcfce7; padding: 5px 12px;
                border-radius: 999px;
                font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      .pilula i { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
                  display: block; }
      .app.retraida .lateral { margin-left: -252px; opacity: 0; pointer-events: none; }

      /* Visão "Quadrados" do painel: o nome da empresa vinha com white-space:nowrap
         dentro de um flex nowrap, entao ele nunca quebrava e empurrava o badge e o
         resto para FORA do card — o conteudo aparecia cortado. Deixando quebrar e
         permitindo encolher, tudo cabe; com a largura minima em 300px o grid usa
         menos colunas quando precisa, em vez de espremer. */
      .company-grid { grid-template-columns: repeat(auto-fill, minmax(min(300px,100%), 1fr)) !important; }
      .company-grid > * { min-width: 0 !important; }
      .company-tile-head { flex-wrap: wrap !important; min-width: 0 !important; }
      .company-tile-head > * { min-width: 0 !important; }
      .company-tile-head strong { white-space: normal !important; overflow-wrap: anywhere !important; }
      @media (max-width: 760px) {
        .lateral { position: fixed; z-index: 40; box-shadow: 0 0 40px rgba(0,0,0,.4);
                   margin-left: -252px; opacity: 0; pointer-events: none; }
        .app.aberta .lateral { margin-left: 0; opacity: 1; pointer-events: auto; }
      }
    </style>

    <script>
      // DESVIO INTENCIONAL (14o) — barra lateral montada por cima da SPA compilada.
      //
      // O bundle React não tem fonte, então não dá para reescrever a navegação dele.
      // O que se faz aqui: o cabeçalho azul original é escondido por CSS (os botões
      // continuam no DOM) e cada item da barra lateral **clica no botão original**.
      // É o único jeito de trocar de aba sem o fonte — e continua funcionando mesmo
      // que a SPA seja recompilada, desde que os rótulos dos botões não mudem.
      //
      // O menu vem de /api/me, a MESMA fonte que as telas do Flask usam
      // (app/services/permissoes.py), já filtrado pela permissão do usuário.
      (function () {
        var EU = null;

        function svg(d) {
          return d ? '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>' : '';
        }

        function botaoDaSPA(rotulo) {
          var alvo = null;
          document.querySelectorAll('.header .row button.btn').forEach(function (b) {
            if ((b.textContent || '').trim() === rotulo) alvo = b;
          });
          return alvo;
        }

        function marcarAtivo(el) {
          document.querySelectorAll('.lateral .item').forEach(function (i) {
            i.classList.remove('ativo');
          });
          if (el) el.classList.add('ativo');
        }

        function montar() {
          if (document.getElementById('app-lateral')) return;
          var raiz = document.getElementById('root');
          if (!raiz || !EU) return;

          var app = document.createElement('div');
          app.className = 'app';
          app.id = 'app-lateral';

          // ------------------------------------------------------------ lateral
          var lateral = document.createElement('aside');
          lateral.className = 'lateral';

          var html = '<div class="marca-topo"><div class="marca">eC</div>'
            + '<div><b>Central e-CAC</b><span>Pendências &amp; débitos</span></div></div><nav>';

          (EU.menu || []).forEach(function (grupo) {
            html += '<div class="secao">' + grupo.titulo + '</div>';
            grupo.itens.forEach(function (item) {
              var attrs = item.url
                ? 'href="' + item.url + '"'
                : 'href="#" data-spa="' + (item.spa || '') + '"';
              html += '<a class="item" ' + attrs + '>' + svg(item.icone)
                + '<span>' + item.rotulo + '</span></a>';
            });
          });

          html += '<div class="secao">Sessão</div>'
            + '<a class="item sair" href="/logout">' + svg(EU.icone_sair)
            + '<span>Sair</span></a></nav>'
            + '<div class="lateral-rodape">'
            + (EU.id && EU.id !== 'ambiente' ? (EU.nome || EU.usuario || '') + '<br>' : '')
            + 'Sistema da Nescon Contabilidade</div>';
          lateral.innerHTML = html;

          // ----------------------------------------------------------- conteúdo
          var conteudo = document.createElement('div');
          conteudo.className = 'conteudo';
          var barra = document.createElement('div');
          barra.className = 'barra';
          barra.innerHTML =
            '<button class="alternar" title="Recolher menu">'
            + '<svg viewBox="0 0 24 24"><path d="M3 4h18v16H3zM9 4v16"/></svg></button>'
            + '<b>Central Pendências e-CAC</b>'
            + '<div class="fim"><span class="pilula"><i></i>Sistema no ar</span></div>';
          conteudo.appendChild(barra);

          app.appendChild(lateral);
          app.appendChild(conteudo);
          raiz.parentNode.insertBefore(app, raiz);
          conteudo.appendChild(raiz);   // a SPA passa a viver dentro do conteúdo

          // ------------------------------------------------------------- ações
          barra.querySelector('.alternar').addEventListener('click', function () {
            var estreito = window.matchMedia('(max-width: 760px)').matches;
            if (estreito) { app.classList.toggle('aberta'); return; }
            app.classList.toggle('retraida');
            try {
              localStorage.setItem('ecac_lateral',
                app.classList.contains('retraida') ? '1' : '0');
            } catch (e) {}
          });
          try {
            if (localStorage.getItem('ecac_lateral') === '1') app.classList.add('retraida');
          } catch (e) {}

          lateral.querySelectorAll('.item[data-spa]').forEach(function (a) {
            a.addEventListener('click', function (ev) {
              ev.preventDefault();
              var b = botaoDaSPA(a.getAttribute('data-spa'));
              if (b) { b.click(); marcarAtivo(a); }
              if (window.matchMedia('(max-width: 760px)').matches) {
                app.classList.remove('aberta');
              }
            });
          });

          // Abertura direta vinda das telas do Flask: /?aba=caixa_postal
          var aba = new URLSearchParams(location.search).get('aba');
          var inicial = lateral.querySelector('.item[data-spa]');
          if (aba) {
            var alvo = lateral.querySelector('.item[href="#"][data-spa]');
            lateral.querySelectorAll('.item[data-spa]').forEach(function (a) {
              if (a.getAttribute('href') === '#' &&
                  (EU.menu || []).some(function (g) {
                    return g.itens.some(function (i) {
                      return i.chave === aba && i.spa === a.getAttribute('data-spa');
                    });
                  })) { alvo = a; }
            });
            if (alvo) { setTimeout(function () { alvo.click(); }, 60); return; }
          }
          marcarAtivo(inicial);
        }

        fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; })
          .then(function (eu) {
            if (!eu || !eu.autenticado) return;
            EU = eu;
            montar();
            // o React redesenha o cabeçalho ao trocar de aba; se a estrutura sumir,
            // remonta. montar() sai cedo quando já existe, então não há laço.
            new MutationObserver(montar).observe(
              document.body, { childList: true, subtree: false });
          }).catch(function () {});
      })();
    </script>
  </body>
</html>
