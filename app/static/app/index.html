<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integra Contador Desktop</title>
    <script type="module" crossorigin src="/assets/index-BV8l56Oy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BrQWbY9G.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Converter campos sensíveis para type="password" após renderização
      const observer = new MutationObserver(() => {
        document.querySelectorAll('label').forEach(label => {
          const text = label.textContent.trim().toLowerCase();
          if (text.includes('consumer key') || text.includes('consumer secret') ||
              text.includes('senha do certificado') || text.includes('senha do procurador')) {
            const input = label.parentElement.querySelector('input[type="text"], input:not([type])');
            if (input && input.type !== 'password') {
              input.type = 'password';
              input.autocomplete = 'off';
            }
          }
        });
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>

    <script>
      // DESVIO INTENCIONAL (12o) — seção "Administração" no menu da SPA.
      //
      // As telas novas (procurações, agendamento, restaurar) são servidas pelo Flask e
      // não existem no bundle React, que é compilado e sem fonte — não dá para
      // acrescentar botão nele. A saída é injetar aqui, no index.html, que já não é
      // idêntico ao do exe (o script de máscara de senha acima também foi acrescentado).
      // Os arquivos em /assets continuam intocados.
      //
      // O "Sair" entra junto: com a tela de login (10o desvio), o usuário precisava de
      // uma forma de encerrar a sessão, e a SPA não tem nenhuma.
      (function () {
        const ID = 'secao-administracao';
        const ITENS = [
          { href: '/usuarios',    texto: 'Usuários e acessos', dica: 'Quem entra, em quais telas e empresas', rotina: '__admin__' },
          { href: '/procuracoes', texto: 'Procurações',     dica: 'Quem a SERPRO recusa e trava de chamadas pagas', rotina: 'procuracoes' },
          { href: '/agendamento', texto: 'Agendamento',     dica: 'Rotinas automáticas e teto de gasto', rotina: 'agendamento' },
          { href: '/restaurar',   texto: 'Restaurar dados', dica: 'Enviar banco e certificado A1', rotina: 'restaurar' },
        ];

        // DESVIO INTENCIONAL (13o) — o menu reflete a permissão do usuário.
        // Isto é conforto, NÃO segurança: quem vale é o servidor, que recusa a rota
        // mesmo se alguém digitar a URL na mão.
        const BOTOES = {
          'dashboard': 'dashboard',
          'configurações': 'configuracoes',
          'configuracoes': 'configuracoes',
          'pagamentos de tributos': 'pagamentos',
          'dctfweb lote': 'dctfweb',
          'das lote': 'das',
          'caixa postal': 'caixa_postal',
          'parcelamentos': 'parcelamentos',
          'custos api': 'custos_api',
        };
        let EU = null;

        function podeRotina(chave) {
          if (!EU) return true;                       // ainda carregando: não esconde nada
          if (chave === '__admin__') return !!EU.admin;
          if (EU.admin) return true;
          return (EU.rotinas || []).includes(chave);
        }

        function aplicarPermissoes(barra) {
          if (!EU) return;
          barra.querySelectorAll('button.btn').forEach(b => {
            const chave = BOTOES[(b.textContent || '').trim().toLowerCase()];
            if (chave) b.style.display = podeRotina(chave) ? '' : 'none';
          });
        }

        function montar(barra) {
          const caixa = document.createElement('div');
          caixa.id = ID;
          caixa.style.cssText = 'position:relative;display:inline-block;';

          const botao = document.createElement('button');
          botao.className = 'btn secondary';
          botao.type = 'button';
          botao.textContent = 'Administração ▾';

          const lista = document.createElement('div');
          lista.style.cssText = [
            'position:absolute', 'right:0', 'top:calc(100% + 6px)', 'min-width:230px',
            'background:#fff', 'border:1px solid #e3e5e8', 'border-radius:10px',
            'box-shadow:0 6px 20px rgba(0,0,0,.14)', 'padding:6px', 'z-index:9999',
            'display:none', 'text-align:left',
          ].join(';');

          function item(href, texto, dica, cor) {
            const a = document.createElement('a');
            a.href = href;
            a.style.cssText = 'display:block;padding:8px 10px;border-radius:7px;'
              + 'text-decoration:none;color:' + (cor || '#1c1e21') + ';';
            const t = document.createElement('div');
            t.textContent = texto;
            t.style.cssText = 'font-size:14px;font-weight:600;';
            a.appendChild(t);
            if (dica) {
              const d = document.createElement('div');
              d.textContent = dica;
              d.style.cssText = 'font-size:11px;color:#6b7280;margin-top:1px;';
              a.appendChild(d);
            }
            a.addEventListener('mouseenter', () => a.style.background = '#f0f1f3');
            a.addEventListener('mouseleave', () => a.style.background = 'transparent');
            return a;
          }

          ITENS.filter(i => podeRotina(i.rotina))
               .forEach(i => lista.appendChild(item(i.href, i.texto, i.dica)));

          const risco = document.createElement('div');
          risco.style.cssText = 'height:1px;background:#e3e5e8;margin:6px 4px;';
          lista.appendChild(risco);

          if (EU) {
            const quem = document.createElement('div');
            quem.textContent = (EU.nome || EU.usuario) + (EU.admin ? ' · administrador' : '');
            quem.style.cssText = 'padding:4px 10px;font-size:11px;color:#6b7280;';
            lista.appendChild(quem);
          }
          lista.appendChild(item('/logout', 'Sair', 'Encerrar a sessão', '#b3261e'));

          botao.addEventListener('click', (ev) => {
            ev.stopPropagation();
            lista.style.display = lista.style.display === 'none' ? 'block' : 'none';
          });
          document.addEventListener('click', () => { lista.style.display = 'none'; });
          document.addEventListener('keydown', (ev) => {
            if (ev.key === 'Escape') lista.style.display = 'none';
          });

          caixa.appendChild(botao);
          caixa.appendChild(lista);
          barra.appendChild(caixa);
        }

        function injetar() {
          const barra = document.querySelector('.header .row');
          if (!barra) return;
          // Esconder o que o usuário não pode abrir roda SEMPRE: o React redesenha os
          // botões a cada troca de aba e eles voltam visíveis.
          aplicarPermissoes(barra);
          if (document.getElementById(ID)) return;      // a seção já está lá
          montar(barra);
        }

        // O React redesenha o cabeçalho ao trocar de aba e leva o botão junto;
        // o observer recoloca. O injetar() só remonta a seção se ela sumiu, então
        // não há laço.
        new MutationObserver(injetar).observe(
          document.getElementById('root'), { childList: true, subtree: true });
        injetar();

        // Quem sou eu chega depois; ao responder, refaz a seção já com as permissões.
        fetch('/api/me').then(r => r.ok ? r.json() : null).then(eu => {
          if (!eu || !eu.autenticado) return;
          EU = eu;
          const antiga = document.getElementById(ID);
          if (antiga) antiga.remove();                  // remonta com os itens certos
          injetar();
        }).catch(() => {});
      })();
    </script>
  </body>
</html>
