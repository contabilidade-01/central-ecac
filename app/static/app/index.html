    <script>
      // Converter campos sensíveis para type="password" após renderização
      const observer = new MutationObserver(() => {
        document.querySelectorAll('label').forEach(label => {
          const text = label.textContent.trim().toLowerCase();
          if (text.includes('consumer key') || text.includes('consumer secret') ||
              text.includes('senha do certificado') || text.includes('senha do procurador')) {
            const input = label.parentElement.querySelector('input[type="text"], input:not([type])');
            if (input && input.type !== 'password') {
              input.type = 'password';
              input.autocomplete = 'off';
            }
          }
        });
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>

    <script>
      // DESVIO INTENCIONAL (14o) — barra lateral montada por cima da SPA compilada.
      //
      // O bundle React não tem fonte, então não dá para reescrever a navegação dele.
      // O que se faz aqui: o cabeçalho azul original é escondido por CSS (os botões
      // continuam no DOM) e cada item da barra lateral **clica no botão original**.
      // É o único jeito de trocar de aba sem o fonte — e continua funcionando mesmo
      // que a SPA seja recompilada, desde que os rótulos dos botões não mudem.
      //
      // O menu vem de /api/me, a MESMA fonte que as telas do Flask usam
      // (app/services/permissoes.py), já filtrado pela permissão do usuário.
      (function () {
        var EU = null;

        function svg(d) {
          return d ? '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>' : '';
        }

        function botaoDaSPA(rotulo) {
          var alvo = null;
          document.querySelectorAll('.header .row button.btn').forEach(function (b) {
            if ((b.textContent || '').trim() === rotulo) alvo = b;
          });
          return alvo;
        }

        function marcarAtivo(el) {
          document.querySelectorAll('.lateral .item').forEach(function (i) {
            i.classList.remove('ativo');
          });
          if (el) el.classList.add('ativo');
        }

        function montar() {
          if (document.getElementById('app-lateral')) return;
          var raiz = document.getElementById('root');
          if (!raiz || !EU) return;

          var app = document.createElement('div');
          app.className = 'app';
          app.id = 'app-lateral';

          // ------------------------------------------------------------ lateral
          var lateral = document.createElement('aside');
          lateral.className = 'lateral';

          var html = '<div class="marca-topo"><div class="marca">eC</div>'
            + '<div><b>Central Ecac</b><span>Nescon Contabilidade</span></div></div><nav>';

          // Mesmo menu do novo frontend: "Mesa do dia" no lugar do Dashboard antigo
          // e o FGTS abrindo na tela nova.
          var temMesa = (EU.menu || []).some(function (g) {
            return g.itens.some(function (i) { return i.chave === 'dashboard'; });
          });
          if (temMesa) html += '<a class="item" href="/app"><span>Mesa do dia</span><span class="novo">novo</span></a>'
            + '<a class="item" href="/app/empresas"><span>Empresas</span><span class="novo">novo</span></a>';
          (EU.menu || []).forEach(function (grupo) {
            var itens = grupo.itens.filter(function (i) { return i.chave !== 'dashboard'; });
            if (!itens.length) return;
            html += '<div class="secao">' + grupo.titulo + '</div>';
            itens.forEach(function (item) {
              var novo = '';
              var url = item.url;
              if (item.chave === 'fgts') { url = '/app/fgts'; novo = '<span class="novo">novo</span>'; }
              var attrs = url
                ? 'href="' + url + '"'
                : 'href="#" data-spa="' + (item.spa || '') + '"';
              html += '<a class="item" ' + attrs + '>' + svg(item.icone)
                + '<span>' + item.rotulo + '</span>' + novo + '</a>';
            });
          });

          html += '<div class="secao">Sessão</div>'
            + '<a class="item sair" href="/logout">' + svg(EU.icone_sair)
            + '<span>Sair</span></a></nav>'
            + '<div class="lateral-rodape">'
            + (EU.id && EU.id !== 'ambiente' ? (EU.nome || EU.usuario || '') + '<br>' : '')
            + 'Sistema da Nescon Contabilidade</div>';
          lateral.innerHTML = html;

          // ----------------------------------------------------------- conteúdo
          var conteudo = document.createElement('div');
          conteudo.className = 'conteudo';
          var barra = document.createElement('div');
          barra.className = 'barra';
          barra.innerHTML =
            '<button class="alternar" title="Recolher menu">'
            + '<svg viewBox="0 0 24 24"><path d="M3 4h18v16H3zM9 4v16"/></svg></button>'
            + '<a class="busca-topo" href="/app">Buscar empresa, CNPJ ou tela <kbd>Ctrl K</kbd></a>'
            + '<div class="fim"><button type="button" class="alternar-tema">'
            + (document.documentElement.dataset.tema === 'claro' ? 'Tema escuro' : 'Tema claro') + '</button>'
            + (EU.id && EU.id !== 'ambiente' ? '<span class="nome-usuario">' + (EU.nome || EU.usuario || '') + '</span>' : '')
            + '</div>';
          conteudo.appendChild(barra);

          app.appendChild(lateral);
          app.appendChild(conteudo);
          raiz.parentNode.insertBefore(app, raiz);
          conteudo.appendChild(raiz);   // a SPA passa a viver dentro do conteúdo

          // ------------------------------------------------------------- ações
          barra.querySelector('.alternar-tema').addEventListener('click', function () {
            var claro = document.documentElement.dataset.tema !== 'claro';
            if (claro) document.documentElement.dataset.tema = 'claro';
            else delete document.documentElement.dataset.tema;
            try { localStorage.setItem('central_tema', claro ? 'claro' : 'escuro'); } catch (e) {}
            this.textContent = claro ? 'Tema escuro' : 'Tema claro';
          });
          barra.querySelector('.alternar').addEventListener('click', function () {
            var estreito = window.matchMedia('(max-width: 760px)').matches;
            if (estreito) { app.classList.toggle('aberta'); return; }
            app.classList.toggle('retraida');
            try {
              localStorage.setItem('ecac_lateral',
                app.classList.contains('retraida') ? '1' : '0');
            } catch (e) {}
          });
          try {
            if (localStorage.getItem('ecac_lateral') === '1') app.classList.add('retraida');
          } catch (e) {}

          lateral.querySelectorAll('.item[data-spa]').forEach(function (a) {
            a.addEventListener('click', function (ev) {
              ev.preventDefault();
              var b = botaoDaSPA(a.getAttribute('data-spa'));
              if (b) { b.click(); marcarAtivo(a); }
              if (window.matchMedia('(max-width: 760px)').matches) {
                app.classList.remove('aberta');
              }
            });
          });

          // Abertura direta vinda das telas do Flask: /?aba=caixa_postal
          var aba = new URLSearchParams(location.search).get('aba');
          var inicial = lateral.querySelector('.item[data-spa]');
          if (aba) {
            var alvo = lateral.querySelector('.item[href="#"][data-spa]');
            lateral.querySelectorAll('.item[data-spa]').forEach(function (a) {
              if (a.getAttribute('href') === '#' &&
                  (EU.menu || []).some(function (g) {
                    return g.itens.some(function (i) {
                      return i.chave === aba && i.spa === a.getAttribute('data-spa');
                    });
                  })) { alvo = a; }
            });
            if (alvo) { setTimeout(function () { alvo.click(); }, 60); return; }
          }
          marcarAtivo(null);
        }

        fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; })
          .then(function (eu) {
            if (!eu || !eu.autenticado) return;
            EU = eu;
            montar();
            // o React redesenha o cabeçalho ao trocar de aba; se a estrutura sumir,
            // remonta. montar() sai cedo quando já existe, então não há laço.
            new MutationObserver(montar).observe(
              document.body, { childList: true, subtree: false });
          }).catch(function () {});
      })();
    </script>

    <script>
      // DESVIO — ticar empresa em Configurações → entra no Escritório.
      // A SPA não tem fonte; injetamos o checkbox nos cards (.company-grid).
      (function () {
        var mapa = null; // cnpj digits → {id, incluso}
        var carregando = false;

        function soDigitos(t) { return String(t || '').replace(/\D/g, ''); }

        function carregar(cb) {
          if (mapa) { cb(); return; }
          if (carregando) return;
          carregando = true;
          fetch('/escritorio/api/empresas', { credentials: 'same-origin' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              mapa = {};
              if (j && j.ok && Array.isArray(j.empresas)) {
                j.empresas.forEach(function (e) {
                  mapa[soDigitos(e.cnpj)] = { id: e.id, incluso: !!e.incluso, ativo: !!e.ativo };
                });
              }
            })
            .catch(function () { mapa = {}; })
            .finally(function () { carregando = false; cb(); });
        }

        function banner(grid) {
          var host = grid.parentElement || grid;
          var b = document.getElementById('ecac-esc-banner');
          if (!b) {
            b = document.createElement('div');
            b.id = 'ecac-esc-banner';
            b.className = 'ecac-esc-banner';
            b.innerHTML = '<span>Marque <b>Escritório</b> nas empresas que devem aparecer em '
              + '<a href="/escritorio" target="_top">Escritório → Empresas</a>.</span>';
            host.insertBefore(b, host.firstChild);
          }
          b.style.display = 'flex';
        }

        function injetar() {
          var grid = document.querySelector('.company-grid');
          if (!grid) return;
          banner(grid);
          carregar(function () {
            Array.prototype.forEach.call(grid.children, function (tile) {
              if (tile.querySelector('.ecac-esc-check')) return;
              var texto = tile.textContent || '';
              var m = texto.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/);
              if (!m) return;
              var cnpj = soDigitos(m[0]);
              var info = mapa[cnpj];
              if (!info) return;
              var lab = document.createElement('label');
              lab.className = 'ecac-esc-check';
              lab.setAttribute('data-off', info.incluso ? '0' : '1');
              var chk = document.createElement('input');
              chk.type = 'checkbox';
              chk.checked = !!info.incluso;
              chk.disabled = !info.ativo;
              lab.appendChild(chk);
              lab.appendChild(document.createTextNode(' Escritório (PGDAS / XML)'));
              chk.addEventListener('change', function () {
                var incluso = !!chk.checked;
                chk.disabled = true;
                fetch('/escritorio/api/empresas/toggle', {
                  method: 'POST', credentials: 'same-origin',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ company_id: info.id, incluso: incluso })
                }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok && j.ok, j: j }; }); })
                  .then(function (x) {
                    if (!x.ok) { chk.checked = !incluso; return; }
                    info.incluso = incluso;
                    lab.setAttribute('data-off', incluso ? '0' : '1');
                  })
                  .catch(function () { chk.checked = !incluso; })
                  .finally(function () { chk.disabled = !info.ativo; });
              });
              tile.appendChild(lab);
            });
          });
        }

        var obs = new MutationObserver(function () { injetar(); });
        function start() {
          if (!document.getElementById('root')) return;
          obs.observe(document.getElementById('root'), { childList: true, subtree: true });
          injetar();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
      })();
    </script>
  </body>
</html>
