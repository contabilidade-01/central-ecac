<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Escritório{% endblock %} • Central e-CAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
{% include 'escritorio/_tema.css' %}
{% block css %}{% endblock %}
</style>
</head>
<body{% block body_attrs %}{% endblock %}>
{% block corpo %}{% endblock %}

<!-- Aviso padrão das telas modeladas: nenhum botão executa ação nesta etapa. -->
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box alert-warning" id="alertBox">
    <div class="alert-icon" id="alertIcon">⚠</div>
    <div class="alert-title" id="alertTitle">Ação pendente</div>
    <div class="alert-msg" id="alertMsg"></div>
    <button type="button" class="alert-btn" onclick="fecharAlerta()">OK</button>
  </div>
</div>

<script>
{% include 'escritorio/_tema.js' %}
</script>
{% block js %}{% endblock %}
</body>
</html>
