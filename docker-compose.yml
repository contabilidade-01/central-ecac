# Central Pendências e-CAC
#
# Uso local/VPS manual:      docker compose up -d --build
# No EasyPanel este arquivo NÃO é usado (ele constrói pelo Dockerfile e você declara
# volume/variáveis pela interface) — serve de referência do que configurar lá.

services:
  app:
    build: .
    image: central-ecac:latest
    container_name: central-ecac
    restart: unless-stopped

    ports:
      # No EasyPanel NÃO exponha porta: o proxy dele fala com o container pela rede
      # interna. Aqui é para acesso direto na VPS/localhost.
      - "5847:5847"

    environment:
      DATA_DIR: /data
      PORT: "5847"
      TZ: America/Sao_Paulo
      # Obrigatórias em produção — ver .env.example
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      AUTH_USER: ${AUTH_USER:?defina AUTH_USER no .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?defina AUTH_PASSWORD no .env}
      # Automação — ver .env.example e a tela /agendamento
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      SCHEDULER_INTERVALO_S: ${SCHEDULER_INTERVALO_S:-300}
      LIMITE_GASTO_MENSAL: ${LIMITE_GASTO_MENSAL:-0}

    volumes:
      # ÚNICO volume que importa: banco, PDFs, certificados e logs.
      - dados:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5847/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dados:
    driver: local
